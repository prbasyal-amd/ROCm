# Petraia documentation review — CONSUMING-REPO variant (for ROCm-internal)
#
# Unlike the self-test (which reviews Petraia's own examples/docs), this runs in
# a CONSUMING repo (ROCm-internal) and calls Petraia from the runner's ON-DISK
# copy at $PETRAIA_HOME. The consuming repo does NOT vendor or check out Petraia.
#
# How it resolves Petraia:
#   - The self-hosted runner keeps a Petraia checkout at PETRAIA_HOME (upgraded
#     periodically — see the on-disk-Petraia topology). This workflow does NOT
#     check Petraia out; it invokes $PETRAIA_HOME/router/petraia_review.py.
#   - --repo points at THIS repo's checkout (the git root of ROCm-internal's
#     content). IMPORTANT: with --changed, --repo MUST be the git root (a known
#     limitation — git returns root-relative paths regardless of subdir).
#   - Rules / wordlists / Vale config resolve from PETRAIA_HOME via env
#     (PETRAIA_ROOT / PETRAIA_RULES / PETRAIA_WORDLISTS / PETRAIA_VALE_CONFIG),
#     so the SAME ruleset that review uses everywhere applies here.
#
# NO gateway secret: the judge reads the AMD gateway config from the runner's
# on-disk Claude Code settings.json (the petraia-runner user). The credential
# lives once on the runner and is never copied into this repo's secrets.
#
# Scope: RELEASE NOTES only (the first high-value target). Widen the paths:
# filter later to cover more of the docs tree.

name: docs-check

on:
  pull_request:
    # NOTE: set this to ROCm-internal's default branch if it isn't `develop`.
    paths:
      - "docs/about/release-notes.md"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  checks: write            # inline check-run annotations

# Point every job at the runner's on-disk Petraia. Override PETRAIA_HOME here if
# the runner stores it elsewhere.
env:
  PETRAIA_HOME: /home/petraia-runner/petraia

jobs:
  # ---------------------------------------------------------------------------
  # 1. Vale — mechanical gate. Reads rules/config from PETRAIA_HOME; reviews
  #    THIS repo's changed release-notes files. No gateway, no secrets.
  # ---------------------------------------------------------------------------
  vale:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Check out the PR (ROCm-internal content)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # required for --changed (diff vs base)

      - name: Sync Vale style packages (in PETRAIA_HOME)
        run: |
          cd "$PETRAIA_HOME/vale"
          vale sync

      - name: Run Vale stage (petraia-review --no-llm)
        run: |
          python3 "$PETRAIA_HOME/router/petraia_review.py" \
            --repo . \
            --changed --base "${{ github.event.pull_request.base.sha }}" \
            --diff-scope --diff-context 2 --gate-diff-scope \
            --no-llm \
            --format json --out vale-report.json
        # --diff-scope: whole-file review, but the report is filtered to findings
        # on lines this PR changed (so annotations aren't buried / capped by the
        # file's pre-existing findings). --gate-diff-scope: the gate fails (and
        # skips the judge) ONLY on errors introduced on changed lines — a
        # suggestion-only edit no longer trips on the file's pre-existing errors.
        # Trade-off: pre-existing legal/spelling errors don't block PRs that
        # don't touch those lines. (Chosen 2026-07: PR accountable for its diff.)
        env:
          PETRAIA_ROOT: ${{ env.PETRAIA_HOME }}
          PETRAIA_RULES: ${{ env.PETRAIA_HOME }}/rules
          PETRAIA_WORDLISTS: ${{ env.PETRAIA_HOME }}/wordlists
          PETRAIA_VALE_CONFIG: ${{ env.PETRAIA_HOME }}/vale/.vale.ini

      - name: Upload Vale report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vale-report
          path: vale-report.json

  # ---------------------------------------------------------------------------
  # 2. LLM judge — only if Vale passed. Reads gateway config from the runner's
  #    on-disk Claude Code settings.json — NO secret in this repo.
  # ---------------------------------------------------------------------------
  judge:
    needs: vale
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Check out the PR (ROCm-internal content)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Vale style packages (in PETRAIA_HOME)
        run: |
          cd "$PETRAIA_HOME/vale" && vale sync

      - name: Run full pipeline (Vale + router + judge)
        run: |
          python3 "$PETRAIA_HOME/router/petraia_review.py" \
            --repo . \
            --changed --base "${{ github.event.pull_request.base.sha }}" \
            --diff-scope --diff-context 2 --gate-diff-scope \
            --workers 8 --rps 9 \
            --format json --out docs-review.json
        env:
          PETRAIA_ROOT: ${{ env.PETRAIA_HOME }}
          PETRAIA_RULES: ${{ env.PETRAIA_HOME }}/rules
          PETRAIA_WORDLISTS: ${{ env.PETRAIA_HOME }}/wordlists
          PETRAIA_VALE_CONFIG: ${{ env.PETRAIA_HOME }}/vale/.vale.ini
          PETRAIA_JUDGE_MODEL: claude-sonnet-4-6
          # No ANTHROPIC_* / gateway secret: the judge reads the gateway config
          # from the runner's on-disk Claude Code settings.json. --rps 9 keeps
          # us under the dev key's 10 req/s ceiling (raise with the prod key).

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-review
          path: docs-review.json

  # ---------------------------------------------------------------------------
  # 3. Annotate — inline check-run annotations from the report. The pipeline
  #    already DIFF-SCOPED the report (--diff-scope), so it contains only findings
  #    on lines this PR changed; this job just renders them (errors first, so a
  #    truncation drops advisories not errors). The whole-file counts + suppressed
  #    total are in the report artifact. Runs even if the gate tripped (judge
  #    skipped) — that is the case with the most to show.
  # ---------------------------------------------------------------------------
  annotate:
    needs: [vale, judge]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          path: reports
        continue-on-error: true

      - name: Post inline annotations
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const candidates = [
              'reports/docs-review/docs-review.json',
              'reports/vale-report/vale-report.json',
            ];
            let report = null;
            for (const p of candidates) {
              if (fs.existsSync(p)) {
                try { report = JSON.parse(fs.readFileSync(p, 'utf8')); break; }
                catch (e) { core.warning(`could not parse ${p}: ${e}`); }
              }
            }
            if (!report) { core.info('no report artifact found; nothing to annotate.'); return; }

            const sevMap = { error: 'failure', warning: 'warning', suggestion: 'notice' };
            const all = [];
            for (const f of (report.vale || [])) {
              if (!f.file || !f.line) continue;
              all.push({ level: sevMap[f.severity] || 'notice', path: f.file, line: f.line,
                title: `Vale: ${f.rule_id}`, message: f.message || f.rule_id });
            }
            for (const f of (report.judge || [])) {
              if (f.verdict !== 'violation' || !f.file || !f.line) continue;
              all.push({ level: sevMap[f.severity] || 'notice', path: f.file, line: f.line,
                title: `Petraia: ${f.rule_id}` + (f.needs_human ? ' (needs human)' : ''),
                message: (f.message || '') + (f.suggested_fix ? `\n\nSuggested: ${f.suggested_fix}` : '') });
            }

            // Errors first, so if GitHub truncates it drops advisories, not errors.
            const rank = { failure: 0, warning: 1, notice: 2 };
            all.sort((a, b) => (rank[a.level] - rank[b.level]) || (a.line - b.line));

            const anns = all.map(a => ({
              path: a.path, start_line: a.line, end_line: a.line,
              annotation_level: a.level, title: a.title, message: a.message,
            }));
            const errors = anns.filter(a => a.annotation_level === 'failure').length;
            const suppressed = report.suppressed || 0;

            const head_sha = context.payload.pull_request
              ? context.payload.pull_request.head.sha : context.sha;
            const CHECK_NAME = 'Petraia findings';

            // ALWAYS post a check on this head sha — even with zero findings —
            // so a fixed commit shows an explicit green "clean" check. Skipping
            // when empty leaves the new commit with no current check, so a viewer
            // still sees the previous (unfixed) commit's annotations and the
            // resolution isn't reflected.
            const conclusion = errors > 0 ? 'failure' : (anns.length > 0 ? 'neutral' : 'success');
            const title = anns.length === 0
              ? 'No findings on changed lines'
              : `${anns.length} finding(s) on changed lines`;
            const summary = anns.length === 0
              ? (`No Petraia findings on the lines changed by this PR.` +
                 (suppressed > 0 ? ` (${suppressed} finding(s) on unchanged lines are in the report artifact.)` : ''))
              : (`${anns.length} finding(s) on changed lines (${errors} error, ${anns.length - errors} advisory).` +
                 (suppressed > 0 ? ` ${suppressed} more finding(s) on unchanged lines are in the report artifact.` : ''));

            // Re-use an existing 'Petraia findings' check on THIS head sha instead
            // of creating a new one each run. GitHub never deletes old check runs,
            // so create-every-time makes annotations pile up across re-runs on the
            // same commit. Updating one check REPLACES its annotation set.
            let checkId;
            const existing = await github.rest.checks.listForRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: head_sha, check_name: CHECK_NAME, per_page: 1,
            });
            if (existing.data.total_count > 0) {
              checkId = existing.data.check_runs[0].id;
              await github.rest.checks.update({
                owner: context.repo.owner, repo: context.repo.repo,
                check_run_id: checkId, status: 'completed', conclusion,
                output: { title, summary, annotations: anns.slice(0, 50) },
              });
            } else {
              const created = await github.rest.checks.create({
                owner: context.repo.owner, repo: context.repo.repo,
                name: CHECK_NAME, head_sha, status: 'completed', conclusion,
                output: { title, summary, annotations: anns.slice(0, 50) },
              });
              checkId = created.data.id;
            }
            // Remaining annotations (GitHub caps 50 per call) append to the same check.
            for (let i = 50; i < anns.length; i += 50) {
              await github.rest.checks.update({
                owner: context.repo.owner, repo: context.repo.repo,
                check_run_id: checkId,
                output: { title, summary, annotations: anns.slice(i, i + 50) },
              });
            }
            core.info(`${existing.data.total_count > 0 ? 'updated' : 'created'} check ${checkId}: `
              + `${anns.length} annotation(s); ${suppressed} suppressed (unchanged lines).`);
